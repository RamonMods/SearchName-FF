services:
  - type: web
    name: searchname-ff
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --chdir api app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
